name: CI

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    lint-and-test:
        uses: sakashita44/.github/.github/workflows/reusable-node-ci.yml@main

    image:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: docker build .
