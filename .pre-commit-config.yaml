# pre-commit フック設定
# 使い方: bash scripts/setup.sh（または uvx pre-commit install --hook-type pre-commit --hook-type pre-push）
#
# 実装言語に依らず全リポジトリが持つ共通の品質ゲート
default_stages: [pre-commit]

repos:
    # シークレット混入の検出
    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.30.1
      hooks:
          - id: gitleaks

    # コードフォーマッター (Prettier)
    - repo: https://github.com/pre-commit/mirrors-prettier
      # mirrors-prettier はアーカイブ済みで v4.0.0-alpha.8 が最終版。
      # 動作しなくなった時点で local フック (node 実行) へ切り替える
      rev: v4.0.0-alpha.8
      hooks:
          - id: prettier
            # toml は対象外。prettier はプラグインを対象ファイル側から解決するため、
            # pre-commit の隔離環境へ入れた prettier-plugin-toml を読み込めない
            types_or: [markdown, json, yaml]
            additional_dependencies: ['prettier@3.9.6']
            args: [--write]

    # Markdownリント
    - repo: https://github.com/DavidAnson/markdownlint-cli2
      rev: v0.23.2
      hooks:
          - id: markdownlint-cli2

    # 一般的な誤りの検出・修正
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          # 一つのファイル内での改行コードの混在だけを検出する。
          # --fix=lf は working tree を CRLF とする .gitattributes の
          # Windows 固有スクリプトまで LF へ書き換えるため採らない
          - id: mixed-line-ending
            args: [--fix=no]
          - id: check-merge-conflict
          - id: check-yaml
          - id: check-added-large-files
    # ---- ts レイヤの追加フック (展開時に追記した部分) ----

    # TypeScript の整形とリント、およびリポジトリ全体を見る検査 (push 時)
    # pre-commit の隔離環境ではプロジェクトの依存を解決できないため、
    # npm の依存をそのまま使う local フックとして実行する。
    # eslint の設定はプロジェクト直下から typescript-eslint を解決する
    - repo: local
      hooks:
          - id: prettier-ts
            name: prettier (TypeScript)
            entry: npx prettier --write
            language: system
            files: \.(ts|tsx)$

          - id: eslint
            name: eslint
            entry: npx eslint --fix
            language: system
            files: \.(ts|tsx)$

          # types で絞ると TypeScript ファイルを含まない push でスキップされるため always_run にする
          - id: typecheck
            name: tsc --noEmit (型検査)
            entry: npm run typecheck
            language: system
            always_run: true
            pass_filenames: false
            stages: [pre-push]

          - id: test
            name: node --test
            entry: npm test
            language: system
            always_run: true
            pass_filenames: false
            stages: [pre-push]
